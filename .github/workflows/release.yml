# Publishes to npm when a v* tag is pushed, with npm Trusted Publishing (OIDC): no npm token
# is stored anywhere, and the package gets a provenance attestation.
#
# One-time setup on npmjs.com: package settings -> Trusted Publisher -> GitHub Actions,
# repository Dradradre/honeytokens-as-code, workflow file release.yml.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Trusted publishing needs a recent npm
        run: npm install -g npm@latest
      - name: Tag must match package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Skip versions that are already on npm (e.g. published by hand)
        id: published
        run: |
          if npm view "$(node -p "require('./package.json').name")@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"; echo "${GITHUB_REF_NAME} is already on npm; nothing to publish."
          fi
      - if: steps.published.outputs.already != 'true'
        run: npm ci
      - if: steps.published.outputs.already != 'true'
        run: npm run typecheck && npm test
      - if: steps.published.outputs.already != 'true'
        run: npm publish --provenance --access public
