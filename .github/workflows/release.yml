# Publishes to npm when a v* tag is pushed, with npm Trusted Publishing (OIDC): no npm token
# is stored anywhere, and the package gets a provenance attestation.
#
# One-time setup on npmjs.com: package settings -> Trusted Publisher -> GitHub Actions,
# repository Dradradre/honeytokens-as-code, workflow file release.yml.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Trusted publishing needs a recent npm
        run: npm install -g npm@latest
      - name: Tag must match package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Skip versions that are already on npm (e.g. published by hand)
        id: published
        run: |
          if npm view "$(node -p "require('./package.json').name")@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"; echo "${GITHUB_REF_NAME} is already on npm; nothing to publish."
          fi
      - if: steps.published.outputs.already != 'true'
        run: npm ci
      - if: steps.published.outputs.already != 'true'
        run: npm run typecheck && npm test
      - if: steps.published.outputs.already != 'true'
        run: npm publish --provenance --access public

      # List the release in the official MCP Registry (registry.modelcontextprotocol.io). GitHub OIDC proves we
      # own io.github.Dradradre/*, so no secret is needed. mcp-publisher is pinned and its signature verified.
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Download and verify mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
      - name: server.json must match package.json
        run: |
          test "$(jq -r .version server.json)" = "${GITHUB_REF_NAME#v}"
          test "$(jq -r '.packages[0].version' server.json)" = "${GITHUB_REF_NAME#v}"
          test "$(jq -r .name server.json)" = "$(node -p "require('./package.json').mcpName")"
      - name: Wait until npm serves the new version (the registry checks npm, which lags a minute or two)
        run: |
          for i in $(seq 1 30); do
            npm view "$(node -p "require('./package.json').name")@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1 && exit 0
            sleep 10
          done
          echo "npm still does not serve ${GITHUB_REF_NAME} after 5 minutes"; exit 1
      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
