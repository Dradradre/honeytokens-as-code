# Publishes to npm when a v* tag is pushed, with npm Trusted Publishing (OIDC): no npm token
# is stored anywhere, and the package gets a provenance attestation.
#
# One-time setup on npmjs.com: package settings -> Trusted Publisher -> GitHub Actions,
# repository Dradradre/honeytokens-as-code, workflow file release.yml.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Trusted publishing needs a recent npm
        run: npm install -g npm@latest
      - name: Tag must match package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run typecheck && npm test
      - run: npm publish --provenance --access public
