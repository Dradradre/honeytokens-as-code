<defs>
  <polygon id="hex" points="0.00,-30.00 25.98,-15.00 25.98,15.00 0.00,30.00 -25.98,15.00 -25.98,-15.00" stroke="#F5A524" stroke-opacity=".38" stroke-width="1.2"/>
  <clipPath id="card"><rect width="1200" height="400" rx="22"/></clipPath>
  <linearGradient id="fade" x1="500" x2="820" y1="0" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/>
  </linearGradient>
  <mask id="fadeMask"><rect width="1200" height="400" fill="url(#fade)"/></mask>
  <linearGradient id="scan" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0" stop-color="#F5A524" stop-opacity="0"/>
    <stop offset=".85" stop-color="#F5A524" stop-opacity=".22"/>
    <stop offset="1" stop-color="#FFD27A" stop-opacity=".7"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.2" cy="0.45" r="0.55">
