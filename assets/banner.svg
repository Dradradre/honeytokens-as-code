  </radialGradient>
  <linearGradient id="title" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0" stop-color="#FFD27A"/><stop offset="1" stop-color="#F5A524"/>
  </linearGradient>
</defs>
<style>
  .scan { animation: scan 6s linear infinite; }
  .pulse { animation: pulse 6s ease-in-out infinite; }
  .ring { transform-box: fill-box; transform-origin: center; animation: ring 6s ease-out infinite; }
  .ring2 { transform-box: fill-box; transform-origin: center; animation: ring 6s ease-out .35s infinite; }
  .badge { animation: badge 6s ease-in-out infinite; }
  .cursor { animation: blink 1.1s steps(1) infinite; }
  @keyframes scan { from { transform: translateX(380px); } to { transform: translateX(1300px); } }
  @keyframes pulse { 0%, 52% { opacity: .15; } 58% { opacity: 1; } 85% { opacity: .9; } 100% { opacity: .15; } }
  @keyframes ring { 0%, 54% { transform: scale(.4); opacity: 0; } 56% { opacity: .9; } 85%, 100% { transform: scale(3.2); opacity: 0; } }
  @keyframes badge { 0%, 56% { opacity: 0; transform: translateY(6px); } 62%, 90% { opacity: 1; transform: none; } 100% { opacity: 0; } }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .scan, .pulse, .ring, .ring2, .badge, .cursor { animation: none; } .ring, .ring2 { opacity: 0; } }
</style>
