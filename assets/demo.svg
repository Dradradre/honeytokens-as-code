<svg class="term" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 608" width="100%" role="img" aria-label="Demo: the agent reads the repo, issues a trap, plants it in deploy/legacy/billing.env and registers it. 19 days later the alert names the leaked file.">
